<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo UDABOL - Campus Sacaba</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        /* Panel de búsqueda flotante */
        #search-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 300px;
        }
        #search-container h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #003366;
        }
        select, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #003366;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }
        button:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>

    <div id="search-container">
        <h3>🔍 Buscador UDABOL</h3>
        <select id="destination-select">
            <option value="">-- Selecciona un Aula o Sitio --</option>
            <option value="cc1">Aula CC1 (Centro de Cómputo)</option>
            <option value="cc2">Aula CC2 (Centro de Cómputo)</option>
            <option value="cc3">Aula CC3 (Centro de Cómputo)</option>
            <option value="cc4">Aula CC4 (Centro de Cómputo)</option>
            <option value="a1">Aula A1</option>
            <option value="a2">Aula A2</option>
            <option value="d1">Aula D1</option>
            <option value="d2">Aula D2</option>
            <option value="d3">Aula D3</option>
            <option value="d4">Aula D4</option>
            <option value="d5">Aula D5</option>
        </select>
        <button onclick="buscarYMarcarRuta()">Buscar Ruta</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Coordenadas de la entrada principal UDABOL Sacaba (-17.39066, -66.06903)
        const entradaCoord = [-17.390664, -66.069032];

        // Inicializar mapa centrado en la universidad
        const map = L.map('map').setView(entradaCoord, 19);

        // Capa de Esri World Imagery (Satélite) con maxZoom configurado a 19 para evitar pantallas grises
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 19,
            minZoom: 15
        }).addTo(map);

        // Capa base para la entrada principal
        const entradaMarker = L.marker(entradaCoord).addTo(map)
            .bindPopup("<b>ENTRADA PRINCIPAL UDABOL</b>");

        // Base de datos de aulas extraída de tu KML (Polígonos, Rutas y Descripciones)
        const baseDatosAulas = {
            cc1: {
                nombre: "AULA-CC1",
                polyCoords: [
                    [-17.390766, -66.068872], [-17.390830, -66.068752], 
                    [-17.390769, -66.068714], [-17.390703, -66.068833]
                ],
                rutaCoords: [
                    [-17.390680, -66.069051], [-17.390833, -66.068792], 
                    [-17.390793, -66.068768], [-17.390788, -66.068776]
                ],
                descripcion: "Centro de Cómputo - Aula CC1"
            },
            cc2: {
                nombre: "AULA-CC2",
                polyCoords: [
                    [-17.390703, -66.068833], [-17.390769, -66.068715], 
                    [-17.390714, -66.068680], [-17.390643, -66.068798]
                ],
                rutaCoords: [
                    [-17.390678, -66.069050], [-17.390832, -66.068791], 
                    [-17.390737, -66.068732], [-17.390732, -66.068740]
                ],
                descripcion: "Centro de Cómputo - Aula CC2"
            },
            cc3: {
                nombre: "AULA-CC3",
                polyCoords: [
                    [-17.390653, -66.068645], [-17.390585, -66.068762], 
                    [-17.390643, -66.068797], [-17.390714, -66.068679]
                ],
                rutaCoords: [
                    [-17.390679, -66.069051], [-17.390832, -66.068791], 
                    [-17.390676, -66.068694], [-17.390671, -66.068703]
                ],
                descripcion: "Centro de Cómputo - Aula CC3"
            },
            cc4: {
                nombre: "AULA-CC4",
                polyCoords: [
                    [-17.390585, -66.068761], [-17.390653, -66.068645], 
                    [-17.390582, -66.068604], [-17.390514, -66.068720]
                ],
                rutaCoords: [
                    [-17.390679, -66.069052], [-17.390832, -66.068792], 
                    [-17.390613, -66.068654], [-17.390606, -66.068664]
                ],
                descripcion: "Centro de Cómputo - Aula CC4"
            },
            a1: {
                nombre: "AULA-A1",
                polyCoords: [
                    [-17.390725, -66.069018], [-17.390839, -66.069085], 
                    [-17.390878, -66.069012], [-17.390763, -66.068949]
                ],
                rutaCoords: [
                    [-17.390682, -66.069051], [-17.390709, -66.069010], 
                    [-17.390828, -66.069076], [-17.390854, -66.069032], [-17.390845, -66.069026]
                ],
                descripcion: "Edificio Principal - Aula A1"
            },
            a2: {
                nombre: "AULA-A2",
                polyCoords: [
                    [-17.390762, -66.068948], [-17.390878, -66.069010], 
                    [-17.390922, -66.068932], [-17.390806, -66.068867]
                ],
                rutaCoords: [
                    [-17.390682, -66.069052], [-17.390709, -66.069010], 
                    [-17.390829, -66.069076], [-17.390891, -66.068966], [-17.390880, -66.068960]
                ],
                descripcion: "Edificio Principal - Aula A2"
            },
            d1: {
                nombre: "AULA-D1",
                polyCoords: [
                    [-17.390645, -66.068493], [-17.390536, -66.068428], 
                    [-17.390516, -66.068459], [-17.390626, -66.068525]
                ],
                rutaCoords: [
                    [-17.390672, -66.069048], [-17.390769, -66.068890], 
                    [-17.390502, -66.068721], [-17.390631, -66.068505], [-17.390626, -66.068503]
                ],
                descripcion: "Bloque D - Aula D1"
            },
            d2: {
                nombre: "AULA-D2",
                polyCoords: [
                    [-17.390496, -66.068490], [-17.390607, -66.068556], 
                    [-17.390625, -66.068525], [-17.390516, -66.068459]
                ],
                rutaCoords: [
                    [-17.390671, -66.069048], [-17.390769, -66.068890], 
                    [-17.390502, -66.068721], [-17.390612, -66.068538], [-17.390607, -66.068534]
                ],
                descripcion: "Bloque D - Aula D2"
            },
            d3: {
                nombre: "AULA-D3",
                polyCoords: [
                    [-17.390607, -66.068556], [-17.390497, -66.068490], 
                    [-17.390473, -66.068529], [-17.390585, -66.068593]
                ],
                rutaCoords: [
                    [-17.390672, -66.069048], [-17.390769, -66.068890], 
                    [-17.390502, -66.068721], [-17.390592, -66.068570], [-17.390585, -66.068566]
                ],
                descripcion: "Bloque D - Aula D3"
            },
            d4: {
                nombre: "AULA-D4",
                polyCoords: [
                    [-17.390585, -66.068592], [-17.390474, -66.068528], 
                    [-17.390434, -66.068590], [-17.390548, -66.068656]
                ],
                rutaCoords: [
                    [-17.390670, -66.069049], [-17.390770, -66.068890], 
                    [-17.390502, -66.068721], [-17.390561, -66.068622], [-17.390555, -66.068618]
                ],
                descripcion: "Bloque D - Aula D4"
            },
            d5: {
                nombre: "AULA-D5",
                polyCoords: [
                    [-17.390410, -66.068632], [-17.390524, -66.068696], 
                    [-17.390548, -66.068656], [-17.390433, -66.068590]
                ],
                rutaCoords: [
                    [-17.390672, -66.069049], [-17.390770, -66.068889], 
                    [-17.390502, -66.068721], [-17.390530, -66.068674], [-17.390522, -66.068669]
                ],
                descripcion: "Bloque D - Aula D5"
            }
        };

        let capaActualPoligono = null;
        let capaActualRuta = null;

        function buscarYMarcarRuta() {
            const selectValue = document.getElementById('destination-select').value;
            if (!selectValue) {
                alert("Por favor selecciona un aula o laboratorio.");
                return;
            }

            const aula = baseDatosAulas[selectValue];

            // Limpiar trazos anteriores si existen
            if (capaActualPoligono) map.removeLayer(capaActualPoligono);
            if (capaActualRuta) map.removeLayer(capaActualRuta);

            // Dibujar la ruta en color azul destacado
            capaActualRuta = L.polyline(aula.rutaCoords, {
                color: '#00ffff',
                weight: 5,
                opacity: 0.8
            }).addTo(map);

            // Dibujar el polígono del aula en color verde transparente
            capaActualPoligono = L.polygon(aula.polyCoords, {
                color: '#00ff55',
                fillColor: '#00ff55',
                fillOpacity: 0.4,
                weight: 2
            }).addTo(map);

            // Añadir popup interactivo con la información del aula
            capaActualPoligono.bindPopup(`<b>${aula.nombre}</b><br>${aula.descripcion}`).openPopup();

            // Hacer zoom automático hacia la ruta y el aula seleccionada (limitado para no pasar de zoom 19)
            map.fitBounds(capaActualRuta.getBounds(), { padding: [50, 50], maxZoom: 19 });
        }
    </script>
</body>
</html>
